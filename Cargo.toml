[workspace]
resolver = "3"
members = [
    "crates/templartorrent-core",
    "crates/templartorrent-simd",
    "crates/templartorrent-bench",
    "crates/templartorrent-engine",
    "crates/templartorrent-storage",
    "integration/rbit-adapter",
    "integration/templartorrent",
]
# `cargo build` and `cargo run -p templartorrent` build the GUI.
# The adapter is a member because the client links it, and it is not a default
# member so plain `cargo test` does not run the localhost swarm.
default-members = [
    "crates/templartorrent-core",
    "crates/templartorrent-simd",
    "crates/templartorrent-bench",
    "crates/templartorrent-engine",
    "crates/templartorrent-storage",
    "integration/templartorrent",
]
# Fixture preview stays its own workspace. The rbit fork is a path dependency
# applied through [patch.crates-io], not a member.
exclude = ["integration/pixelkit-preview", "vendor/rbit"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.profiling]
inherits = "release"
debug = 1
strip = "none"

# In-tree fork of rbit 0.2.2 (MIT OR Apache-2.0, https://github.com/jspwrd/rbit):
# identical source except that reqwest is optional (feature `http-client`),
# so the default graph carries no reqwest or ring. HTTPS announces use
# rustls 0.23.46 with aws-lc-rs. See vendor/rbit/TEMPLARTORRENT-FORK.md.
[patch.crates-io]
rbit = { path = "vendor/rbit" }
