[package]
edition = "2021"
rust-version = "1.85"
name = "rbit"
version = "0.2.2"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A BitTorrent library implementing BEP specifications"
documentation = "https://docs.rs/rbit"
readme = "README.md"
keywords = [
    "bittorrent",
    "torrent",
    "p2p",
    "dht",
    "peer-to-peer",
]
categories = [
    "network-programming",
    "asynchronous",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jspwrd/rbit"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[lib]
name = "rbit"
path = "src/lib.rs"

[dependencies.bytes]
version = "1"

[dependencies.crc32c]
version = "0.6"

[dependencies.crossbeam]
version = "0.8"

[dependencies.dashmap]
version = "6"

[dependencies.futures]
version = "0.3"

# TemplarTorrent fork: 768-bit modular exponentiation for the MSE
# Diffie-Hellman exchange (src/peer/mse.rs). Pure Rust.
[dependencies.num-bigint]
version = "0.4"

[dependencies.parking_lot]
version = "0.12"

[dependencies.rand]
version = "0.9"

[dependencies.reqwest]
version = "0.12"
features = ["rustls-tls"]
optional = true
default-features = false

[dependencies.sha1]
version = "0.10"

[dependencies.sha2]
version = "0.10"

[dependencies.thiserror]
version = "1"

[dependencies.tokio]
version = "1"
features = ["full"]

[dependencies.tracing]
version = "0.1"

[dev-dependencies.tempfile]
version = "3"

[dev-dependencies.tokio-test]
version = "0.4"

# TemplarTorrent fork: the HTTP client (reqwest -> rustls -> ring) is opt-in so
# the default build has no non-Rust cryptography. HttpTracker, WebSeed and
# UPnP need the `http-client` feature; the application announces over its
# own bounded plain-HTTP transport instead.
[features]
default = []
http-client = ["dep:reqwest"]
