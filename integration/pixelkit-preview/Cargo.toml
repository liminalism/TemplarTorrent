[package]
name = "templartorrent-preview"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[dependencies]
templartorrent-core = { path = "../../crates/templartorrent-core" }
templartorrent-engine = { path = "../../crates/templartorrent-engine" }
liminalkit-raster = { git = "https://github.com/liminalism/liminalkit" }
liminalkit-shell = { git = "https://github.com/liminalism/liminalkit" }
liminalkit-text = { git = "https://github.com/liminalism/liminalkit" }
liminalkit-ui = { git = "https://github.com/liminalism/liminalkit" }
liminalkit-windowing = { git = "https://github.com/liminalism/liminalkit" }

[workspace]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
