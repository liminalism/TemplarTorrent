[package]
name = "templartorrent-rbit-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Already in the graph through tokio; sets IPV6_V6ONLY off on Windows.
socket2 = "0.6.5"
rbit = "=0.2.2"
templartorrent-core = { path = "../../crates/templartorrent-core" }
templartorrent-engine = { path = "../../crates/templartorrent-engine" }
templartorrent-storage = { path = "../../crates/templartorrent-storage" }
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "io-util"] }
sha1 = "0.10"
# SHA-256 for user-supplied download digests; already in the graph through rbit.
sha2 = "0.10"
bytes = "1"
# rustls 0.23.46 (2026-10-14). Default features are off so ring, logging,
# post-quantum preference and brotli stay out. aws_lc_rs is the provider
# that release enables by default.
rustls = { version = "=0.23.46", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
tokio-rustls = "0.26"
webpki-roots = "0.26"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "test-util"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
